name: Dev

on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Parse version
        id: version
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $version = "1.0.0-dev.$sha"
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "FILE_VERSION=1.0.0.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: |
          dotnet publish "Dust765.4 Launcher/Dust765.4 Launcher.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o publish `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -p:AssemblyVersion=${{ steps.version.outputs.FILE_VERSION }} `
            -p:FileVersion=${{ steps.version.outputs.FILE_VERSION }}

      - name: Create artifact
        run: |
          Compress-Archive -Path publish/* -DestinationPath "Dust765.4-Launcher-${{ steps.version.outputs.VERSION }}.zip"

      - name: Create Dev Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-${{ github.run_number }}
          name: Dev Build (${{ steps.version.outputs.VERSION }})
          files: |
            publish/Dust765.4 Launcher.exe
            Dust765.4-Launcher-${{ steps.version.outputs.VERSION }}.zip
          generate_release_notes: true
          draft: true
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
